# Render 배포 설계 (Blueprint)
#
# Railway와 같은 구조를 그대로 옮긴 것이다. 이미 Dockerfile로 돌고 있어서
# 빌드 방식은 손댈 것이 없고, 두 가지만 맞추면 된다.
#
#   1. 상태를 담는 디스크를 STATE_DIR(/app/var)에 붙인다.
#      안 붙이면 업로드한 사진과 목소리가 재배포마다 사라진다.
#   2. 관리형 Postgres를 DATABASE_URL로 넘긴다.
#      없으면 앱은 JSON 파일 저장소로 떨어져 뜨긴 하지만, 그 파일도 디스크에
#      있어야 남는다.
#
# 값이 비밀인 것(sync: false)은 이 파일에 적지 않는다. Render 대시보드에서
# 직접 넣는다 — 저장소에 키를 커밋하지 않기 위한 것이다.

services:
  - type: web
    name: homestory-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .

    # 디스크는 유료 인스턴스에서만 붙는다. free로 두면 디스크 없이 떠서
    # 업로드가 사라지므로, 이 값을 낮추려면 디스크를 뺄지 함께 정해야 한다.
    plan: starter

    # 한국에서 가까운 쪽을 골랐다. Bedrock(us-east-1)까지는 멀어지지만
    # 그쪽은 질의 계획·추출에만 쓰이고, 화면 응답은 사용자와의 거리가 크다.
    region: singapore

    healthCheckPath: /api/health

    # 업로드·그래프·내보내기·목소리가 여기 쌓인다. Dockerfile의
    # ENV STATE_DIR=/app/var 와 같은 경로여야 한다.
    disk:
      name: state
      mountPath: /app/var
      sizeGB: 1

    envVars:
      # Dockerfile에도 있지만 여기 적어 둔다. 디스크 경로와 한자리에서
      # 보이지 않으면 한쪽만 바꾸는 실수가 난다.
      - key: STATE_DIR
        value: /app/var

      - key: DATABASE_URL
        fromDatabase:
          name: homestory-db
          property: connectionString

      # 배포된 프론트(Vercel)가 이 API를 부를 수 있게 한다. 프리뷰 배포는
      # 주소가 매번 달라서 정규식으로 받는다.
      - key: ALLOWED_ORIGIN_REGEX
        value: https://.*\.vercel\.app

      # 채팅 답변은 EXAONE(FriendliAI)이 쓴다. 사내망 게이트웨이
      # (api.lgresearch.ai = 10.4.240.77)는 공용 클라우드에서 닿지 않는다.
      - key: LLM_ANSWER_PROVIDER
        value: friendli
      - key: FRIENDLI_TOKEN
        sync: false

      # 질의 계획·구조화 추출은 Bedrock으로 보낸다 (빠른 쪽이 유리하다).
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      # 임시 자격증명(ASIA…)을 쓰는 동안만 필요하다. 만료되면 계획·추출이
      # 조용히 규칙 기반으로 내려앉는다 — 장기 키로 바꾸면 이 항목은 지운다.
      - key: AWS_SESSION_TOKEN
        sync: false

      # EXAONE_API_KEY는 넣지 않는다. 닿지 않는 주소를 두드리다 요청마다
      # 타임아웃까지 매달린 적이 있다 (배포에서는 제공자 사슬이 건너뛰게 둔다).

databases:
  - name: homestory-db
    databaseName: homestory
    user: homestory
    region: singapore
    # 무료 플랜은 30일 뒤 삭제된다. 프롬프톤 시연까지만 쓸 것이면 충분하지만,
    # 계속 쓸 거라면 basic-256mb 이상으로 올린다.
    plan: free
